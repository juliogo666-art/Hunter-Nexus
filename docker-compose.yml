services:
  postgres:
    image: postgres:16-alpine
    container_name: hunter_postgres
    restart: always
    environment:
      POSTGRES_USER: hunter_admin
      POSTGRES_PASSWORD: hunter_password
      POSTGRES_DB: hunter_nexus_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: